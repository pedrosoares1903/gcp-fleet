name: Ansible

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  lint:
    # This exact name is what the branch ruleset will require (step 6.2).
    name: Ansible lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Every `run:` step below starts inside ansible/, where ansible.cfg lives.
    defaults:
      run:
        working-directory: ansible

    steps:
      - uses: actions/checkout@v4

      # Same Python as the WSL, so lint here and lint there give the same answer.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Ansible and ansible-lint
        run: pip install -r requirements.txt

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      # ansible.cfg points to a vault password file that only exists on the
      # laptop. Lint never decrypts anything, but Ansible refuses to start
      # when that file is missing, so the job writes a placeholder.
      - name: Placeholder vault password
        run: echo "not-used-by-lint" > .vault-pass-dev

      # Explicit paths: ansible/collections/ holds thousands of third-party
      # files that are not ours to lint.
      - name: Lint
        run: ansible-lint playbooks/ roles/
