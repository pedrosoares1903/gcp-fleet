[defaults]
# dev is the default. prod always has to be asked for by name: -i inventories/prod
inventory = inventories/dev
roles_path = roles
collections_path = collections
interpreter_python = auto_silent
# Seconds ssh waits for the VM to answer. The default (10) is too short for an
# IAP tunnel: gcloud needs a few seconds to open it, more if the VM just booted.
timeout = 30
# The password that opens the dev vault lives in this file, next to ansible.cfg.
# The file is in .gitignore: it never reaches the repository.
vault_identity_list = dev@.vault-pass-dev

[ssh_connection]
# One SSH round trip per task instead of several. Matters more through a tunnel.
pipelining = True
