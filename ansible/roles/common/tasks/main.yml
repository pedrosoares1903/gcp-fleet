# ---------------------------------------------------------------------------
# Step 3.1 - base packages
# ---------------------------------------------------------------------------
- name: Install the base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"        # the whole list, in one apt call
    state: present                       # "make sure they are installed"
    update_cache: true                   # refresh the package index...
    cache_valid_time: 3600               # ...at most once an hour

# ---------------------------------------------------------------------------
# Step 3.2 - automatic security updates
# ---------------------------------------------------------------------------
- name: Turn on automatic security updates
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

# ---------------------------------------------------------------------------
# Step 3.3 - hardened SSH, checked before it goes live
# Step 3.4 - and sshd told to re-read it, only when it changed
# ---------------------------------------------------------------------------
- name: Harden the SSH server
  ansible.builtin.template:
    src: 50-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/50-hardening.conf   # read before the main sshd_config
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s    # sshd tests the new file first (%s = temp copy)
  notify: Reload ssh                     # if this task says "changed", run that handler